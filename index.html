    <style>
      /* --- 基础设置 --- */
      html {
        /* 全局字体放大 */

      html, body, #root {
        height: 100%;

        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-user-select: none;
        user-select: none;
      }

      /* --- 工具类 --- */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      .mask-fade-right {
        -webkit-mask-image: linear-gradient(to right, black 85%, transparent 100%);

        padding-bottom: env(safe-area-inset-bottom, 20px);

      /* --- 经典终端：锐利清晰字芯 + 克制微光 --- */
      .crt-mode {
        text-shadow: 0 0 1.5px rgba(0, 255, 65, 0.45);
        -webkit-font-smoothing: antialiased;
      }

      /* 注意：这里刻意不用 !important。Play CDN 生成的 hover:/active:/group-hover: 变色

      .text-terminal-green { color: #00ff66; }
      .text-terminal-dimGreen { color: #00bb44; }
      .text-shadow-none { text-shadow: none !important; }

      /* WebGL 显像管层置底，UI 浮于其上 */

        background: transparent !important;
        position: relative;
        z-index: 10;
      }

      /* 干净利落的卡片边框 */

        border-color: rgba(0, 255, 102, 0.45) !important;
        box-shadow: 0 0 8px rgba(0, 255, 102, 0.15) !important;
      }

      .crt-mode .bg-terminal-black {
        background-color: rgba(10, 10, 10, 0.85) !important;
        backdrop-filter: blur(8px);
      }

      body.war-mode-active .crt-mode {
        text-shadow: 0 0 3px rgba(255, 0, 0, 0.6), 0 0 8px rgba(255, 0, 0, 0.3);
      }

      body.war-mode-active .crt-mode .border-terminal-green,
      body.war-mode-active .border-red-600 {
        border-color: rgba(239, 68, 68, 0.5) !important;
        box-shadow: 0 0 20px rgba(239, 68, 68, 0.25), inset 0 0 12px rgba(239, 68, 68, 0.1) !important;
      }

      body.war-mode-active {
        background-color: #0f0202 !important;
        color: #ef4444 !important;
      }

      body.war-mode-active .text-terminal-green { color: #ef4444 !important; }
      body.war-mode-active .border-terminal-green { border-color: #7f1d1d !important; }
      body.war-mode-active .bg-terminal-green { background-color: #ef4444 !important; }
      
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #004400; border-radius: 2px; }
      body.war-mode-active ::-webkit-scrollbar-thumb { background: #440000; }

      /* --- 移动端底部抽屉动效 --- */
      @keyframes slide-up {
        from { transform: translateY(100%); opacity: 0.6; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slide-in {
        from { transform: translateX(24px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes scale-in {
        from { transform: scale(0.96); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .animate-slide-up { animation: slide-up 0.28s ease-out; }
      .animate-fade-in { animation: fade-in 0.25s ease-out; }
      .animate-slide-in { animation: slide-in 0.3s ease-out; }
      .animate-scale-in { animation: scale-in 0.3s ease-out; }
