<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>易碎品 (The Fragile Republic)</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Share+Tech+Mono&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">



    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              mono: ['"Share Tech Mono"', '"Courier Prime"', '"Noto Sans SC"', 'monospace'],
              serif: ['"Courier Prime"', '"Noto Sans SC"', 'serif'],
            },
            colors: {
              terminal: {
                black: '#0a0a0a',
                green: '#00ff66',
                dimGreen: '#00bb44',
                red: '#ff0000',
                amber: '#ffb000',
              }
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'marquee': 'marquee 40s linear infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      /* --- 基础设置 --- */
      html {
        /* 全局字体放大 */
        font-size: 18px; 
      }

      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #000;
        color: #00ff41;
        /* 恢复默认字体栈，让 Tailwind 发挥作用 */
        /* 禁止移动端双击缩放 */
        touch-action: manipulation; 
        /* iOS 真机会擅自放大文本（Edge 模拟器不会），锁死 100% 让两边一致 */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-user-select: none;
        user-select: none;
      }

      /* --- 工具类 --- */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      .mask-fade-right {
        -webkit-mask-image: linear-gradient(to right, black 85%, transparent 100%);
        mask-image: linear-gradient(to right, black 85%, transparent 100%);
      }

      /* 浮层底部锚点：底栏 48px + 新闻条 28px = 76px，再叠安全区（无刘海设备 env=0，无影响） */
      .overlay-bottom { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
      .overlay-bottom-sm { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
      .safe-bottom-pad { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 20px);
      }

      /* --- 经典终端：锐利清晰字芯 + 克制微光 --- */
      .crt-mode {
        text-shadow: 0 0 1.5px rgba(0, 255, 65, 0.45);
        -webkit-font-smoothing: antialiased;
      }

      /* 注意：这里刻意不用 !important。Play CDN 生成的 hover:/active:/group-hover: 变色
         是普通声明，一旦基色加 !important，所有悬停反白（hover:text-black 等）全站失效，
         会出现绿字压绿底。战争模式的覆盖规则自带 !important，不受影响。 */
      .text-terminal-green { color: #00ff66; }
      .text-terminal-dimGreen { color: #00bb44; }
      .text-shadow-none { text-shadow: none !important; }

      /* WebGL 显像管层置底，UI 浮于其上 */
      .crt-mode #root {
        background: transparent !important;
        position: relative;
        z-index: 10;
      }

      /* 干净利落的卡片边框 */
      .crt-mode .border-terminal-green {
        border-color: rgba(0, 255, 102, 0.45) !important;
        box-shadow: 0 0 8px rgba(0, 255, 102, 0.15) !important;
      }

      .crt-mode .bg-terminal-black {
        background-color: rgba(10, 10, 10, 0.85) !important;
        backdrop-filter: blur(8px);
      }

      body.war-mode-active .crt-mode {
        text-shadow: 0 0 3px rgba(255, 0, 0, 0.6), 0 0 8px rgba(255, 0, 0, 0.3);
      }

      body.war-mode-active .crt-mode .border-terminal-green,
      body.war-mode-active .border-red-600 {
        border-color: rgba(239, 68, 68, 0.5) !important;
        box-shadow: 0 0 20px rgba(239, 68, 68, 0.25), inset 0 0 12px rgba(239, 68, 68, 0.1) !important;
      }

      body.war-mode-active {
        background-color: #0f0202 !important;
        color: #ef4444 !important;
      }

      body.war-mode-active .text-terminal-green { color: #ef4444 !important; }
      body.war-mode-active .border-terminal-green { border-color: #7f1d1d !important; }
      body.war-mode-active .bg-terminal-green { background-color: #ef4444 !important; }
      
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #004400; border-radius: 2px; }
      body.war-mode-active ::-webkit-scrollbar-thumb { background: #440000; }

      /* --- 移动端底部抽屉动效 --- */
      @keyframes slide-up {
        from { transform: translateY(100%); opacity: 0.6; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slide-in {
        from { transform: translateX(24px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes scale-in {
        from { transform: scale(0.96); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .animate-slide-up { animation: slide-up 0.28s ease-out; }
      .animate-fade-in { animation: fade-in 0.25s ease-out; }
      .animate-slide-in { animation: slide-in 0.3s ease-out; }
      .animate-scale-in { animation: scale-in 0.3s ease-out; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client",
        "react/": "https://aistudiocdn.com/react@^19.2.0/"
      }
    }
    </script>
    <script type="module" crossorigin src="./assets/index-DaqTT3Fs.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
